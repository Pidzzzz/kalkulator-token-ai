<!doctype html>
<html lang="id" data-theme="gelap">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0D12" />
    <meta
      name="description"
      content="Kalkulator Token & Request AI — terjemahkan jatah & batas paket AI menjadi angka yang bisa dibayangkan."
    />
    <title>Kalkulator Token & Request AI</title>

    <script>
      // Pulihkan tema tersimpan sebelum render pertama agar tidak ada kedipan
      try {
        const savedTheme = localStorage.getItem("kalkulator-theme") || "gelap";
        document.documentElement.setAttribute("data-theme", savedTheme);
      } catch (_) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    />

      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔢%3C/text%3E%3C/svg%3E"
    />
  </head>

    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem; font-family: system-ui; text-align: center; color: #EEEBE6; background: #0D0D12">
